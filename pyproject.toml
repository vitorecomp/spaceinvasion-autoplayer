[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceinvasion-autoplayer"
version = "0.1.0"
description = "SpaceInvasion Classic browser autoplayer, HTTP bridge, planner, and operator console"
requires-python = ">=3.12"
dependencies = [
    "selenium>=4.24,<5",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1.0,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "coverage>=7.5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "notebooks: slow Jupyter notebook parity tests",
    "invariants: core SpaceInvasion game and security invariants that must never break",
    "live_backup: tests verifying against a live pg_dump backup when SPACEINVASION_LIVE_BACKUP_DUMP is set",
]
addopts = "-m 'not notebooks and not live_backup'"

[tool.coverage.run]
source = ["backend", "bin", "scripts"]
omit = [
    "backend/ui/*",
    "tests/*",
]
branch = false
core = "sysmon"

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "backend/ui",
    "notebooks",
    ".venv",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "BLE",
    "S110",
    "S112",
    "T20",
    "I",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "bin", "scripts"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"backend/core/game_data.py" = ["B", "BLE", "S110", "S112", "T20", "I"]
"tests/*" = ["B", "BLE", "S110", "S112", "T20", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
explicit_package_bases = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = [
    "^backend/ui/",
    "^notebooks/",
    "^frontend/",
]

[[tool.mypy.overrides]]
module = ["backend.*", "bin.*", "scripts.*"]
strict = true
